name: Build Signed Android App Bundle

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Clean npm cache
        run: npm cache clean --force

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps || {
              echo "npm ci failed because package-lock.json is out of sync; falling back to npm install"
              npm install --legacy-peer-deps
            }
          else
            echo "No package-lock.json found, falling back to npm install"
            npm install --legacy-peer-deps
          fi

      - name: Build web assets
        run: npm run build

      - name: Add Android platform
        run: |
          npx cap add android || echo "android platform already exists"
          npx cap sync android

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, os, re
          data = os.environ.get("KEYSTORE_BASE64", "")
          cleaned = re.sub(r"[^A-Za-z0-9+/=]", "", data)
          with open("android/app/upload-keystore.jks", "wb") as f:
              f.write(base64.b64decode(cleaned))
          PY
          ls -la android/app/upload-keystore.jks
          file android/app/upload-keystore.jks

      - name: Validate signing secrets
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_PASSWORD" || { echo "Missing KEYSTORE_PASSWORD secret"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing KEY_PASSWORD secret"; exit 1; }
          keytool -list -keystore android/app/upload-keystore.jks -storepass "$KEYSTORE_PASSWORD" -alias upload >/dev/null || {
            echo "Keystore validation failed. Check KEYSTORE_BASE64, KEYSTORE_PASSWORD, and that the alias is 'upload'.";
            exit 1;
          }

      - name: Configure signing
        run: |
          cat >> android/app/build.gradle << 'EOF'

          android {
              signingConfigs {
                  release {
                      storeFile file('upload-keystore.jks')
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias 'upload'
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF

      - name: Build signed AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew bundleRelease

      - name: Upload AAB as artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
